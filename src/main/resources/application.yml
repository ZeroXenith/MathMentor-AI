spring:
  application:
    name: mathmentor-ai
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/mathmentor;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:18080}

ai:
  api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:${OPENAI_API_KEY:}}}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  model: ${AI_MODEL:deepseek-v4-flash}
  mock-enabled: ${AI_MOCK_ENABLED:false}
