# Production profile — MySQL, no H2 console, minimal logging
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mathmentor_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
  h2:
    console:
      enabled: false

logging:
  level:
    com.graduation.mathai: INFO

ai:
  mock-enabled: false
